name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # ── CI uses an in-memory SQLite database via pytest fixtures.
    # ── No external Postgres service needed for unit/integration tests.
    # ── (The live-audit scripts in audit_*.py are NOT collected by pytest;
    #    they require a running server and are run manually only.)

    env:
      # Use SQLite in CI — the app's db.py auto-selects the correct engine
      DATABASE_URL: sqlite:///./ci_test.db
      SECRET_KEY: test-secret-key-for-ci-do-not-use-in-prod-0000000000000000
      ENV: test
      DEBUG: "True"
      GITHUB_CLIENT_ID: mock-github-client-id
      GITHUB_CLIENT_SECRET: mock-github-client-secret
      GITHUB_WEBHOOK_SECRET: dev_webhook_secret_for_testing
      GITHUB_OAUTH_REDIRECT_URI: http://localhost:5173/#/auth/callback
      PSIT_PORTAL_BASE_URL: https://www.psit.ac.in/op
      ALLOWED_ORIGINS: "*"
      MAX_ACTIVE_CLAIMS_PER_STUDENT: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (for pyzbar QR decoding)
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit & integration tests
        # pytest.ini sets testpaths=tests so only backend/tests/test_*.py
        # are collected. The audit_*.py live-server scripts are never touched.
        run: |
          python -m pytest -v --tb=short --maxfail=5 \
            --cov=app --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check app/ || true
        continue-on-error: true
