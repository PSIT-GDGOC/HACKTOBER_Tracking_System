name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & OpenAPI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Test Suite
        env:
          ENV: test
          SECRET_KEY: test-secret-key-must-be-at-least-32-characters-long
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
        run: |
          pytest -v

      - name: Verify Alembic Migrations
        env:
          DATABASE_URL: sqlite:///alembic_test.db
        run: |
          python -m alembic upgrade head --sql > migration_test.sql
