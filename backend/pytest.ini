[pytest]
# ─── Test discovery ──────────────────────────────────────────────────────────
# Only collect tests from the tests/ directory. This prevents pytest from
# accidentally picking up live-audit scripts (audit_*.py) or other helper
# scripts sitting in the backend root.
testpaths = tests

# Only treat files matching test_*.py as test modules (default, made explicit)
python_files = test_*.py

# Only treat functions/methods matching test_* as tests (default, made explicit)
python_functions = test_*

# Only treat classes matching Test* as test classes (default, made explicit)
python_classes = Test*

# ─── Output & reporting ──────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers

# ─── Markers ─────────────────────────────────────────────────────────────────
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests requiring a real DB or external service
    unit: marks pure unit tests with no I/O
